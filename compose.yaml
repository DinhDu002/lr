name: lr

# LR's local development, on the dev network, whose easy fixed Target wins Blocks in seconds:
#   docker compose up -d --build                 the seed Node and the wallet
#   docker compose --profile mine up -d          also the Mine, rewarding development account 1
# Then open the wallet at http://localhost:8788. Run it as its own project (-p) to keep a second
# stack apart from this one: pass other ports through NODE_RPC_PORT and WALLET_PORT.
#
# DEVELOPMENT KEYS. Both accounts are public: local development only, never for anything that
# holds value. Each is account 0 of the entropy of 32 bytes of one value (accountKey(entropy, 0)):
#   account 1, entropy of 0x01
#     tlr1qqqlh49v75au7t3xm6hq62p5awm7ajvvus4nnjuc0cjsfuk9cyzpqasflqyes
#     absurd amount doctor acoustic avoid letter advice cage absurd amount doctor acoustic
#     avoid letter advice cage absurd amount doctor acoustic avoid letter advice comic
#   account 2, entropy of 0x02
#     tlr1qqqm4t3jhxtg8aaj3tq6dj8ehqxvrrtggwg8zkzfrr7v4dlfy0gn33s2545g9
#     acoustic avoid letter advice cage absurd amount doctor acoustic avoid letter advice cage
#     absurd amount doctor acoustic avoid letter advice cage absurd amount exchange

x-node: &node
  build:
    context: .
    target: lr-node
  image: lr-node:local
  restart: "no"

services:
  seed:
    <<: *node
    command:
      - --network
      - dev
      - --data
      - /data
      - --listen
      - 0.0.0.0:9444
      - --rpc
      - 0.0.0.0:9445
    ports:
      - "127.0.0.1:${NODE_RPC_PORT:-9445}:9445"
    volumes: [seed-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9444"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Mine runs only when this profile is on. Light mode and one thread need no 2 GiB dataset.
  mine:
    <<: *node
    profiles: [mine]
    command:
      - mine
      - --network
      - dev
      - --data
      - /data
      - --seed
      - seed:9444
      - --reward-address
      - ${MINE_ADDRESS:-tlr1qqqlh49v75au7t3xm6hq62p5awm7ajvvus4nnjuc0cjsfuk9cyzpqasflqyes}
      - --threads
      - "1"
      - --mode
      - light
      - --rpc
      - "off"
    volumes: [mine-data:/data]
    cpus: 1
    mem_limit: 1g
    depends_on:
      seed:
        condition: service_healthy

  wallet:
    build:
      context: .
      target: wallet
      args:
        VITE_NODE_URL: http://localhost:${NODE_RPC_PORT:-9445}
        VITE_NETWORK: dev
    image: lr-wallet:local
    ports:
      - "127.0.0.1:${WALLET_PORT:-8788}:80"

volumes:
  seed-data:
  mine-data:
