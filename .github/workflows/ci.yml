name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # packages/core is the WebAssembly build of crates/core (ADR 0009).
      - run: rustup toolchain install
      - name: Install wasm-bindgen-cli
        run: |
          curl -sSfL -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen.tar.gz" | sha256sum -c
          tar -xzf wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen"
        env:
          V: 0.2.129 # the wasm-bindgen version in crates/core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # In real browsers: the wallet, against stubs of the Node.
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # packages/core is the WebAssembly build of crates/core (ADR 0009); the wallet is built on it.
      - run: rustup toolchain install
      - name: Install wasm-bindgen-cli
        run: |
          curl -sSfL -o wasm-bindgen.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$V/wasm-bindgen-$V-x86_64-unknown-linux-musl.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  wasm-bindgen.tar.gz" | sha256sum -c
          tar -xzf wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin" "wasm-bindgen-$V-x86_64-unknown-linux-musl/wasm-bindgen"
        env:
          V: 0.2.129 # the wasm-bindgen version in crates/core/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dinhdu002/lr-core build
      - run: pnpm --filter @dinhdu002/lr-wallet exec playwright install --with-deps chromium firefox
      - run: pnpm --filter @dinhdu002/lr-wallet test:browser

  # On both architectures the image is built for, so RandomX's vectors run natively on each.
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      # crates/randomx builds RandomX with these rather than the runner image's own CMake.
      CMAKE: /usr/bin/cmake
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # CMake at Ubuntu 24.04's only version; GCC 13 takes Ubuntu's fixes, so only its major is pinned.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake=3.28.3-1build7 g++-13
          "$CMAKE" --version && "$CXX" --version
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      # The same vectors on musl, in the Dockerfile stage that builds lr-node for the Alpine image.
      - run: docker build --target lr-node .

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build only; rust above builds lr-node, and image.yml publishes it.
      - run: docker build --target wallet .
